spring:
  application:
    name: iot-server

  datasource:
    url: jdbc:postgresql://localhost:5432/iot
    username: iot_user
    password: iotph

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format-sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO